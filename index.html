<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GabAI — L'Intelligenza dell'Universo</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --void:#050510; --glow-cyan:#00f5ff; --glow-purple:#bf00ff;
    --glass:rgba(255, 255, 255, 0.03); --border:rgba(0, 245, 255, 0.2);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--void);color:#fff;font-family:'Rajdhani',sans-serif;height:100vh;overflow:hidden;display:flex;justify-content:center}
  
  #app{width:100%;max-width:600px;display:flex;flex-direction:column;height:100%;padding:20px;gap:20px}
  
  header{text-align:center;padding:20px}
  .title{font-family:'Orbitron';font-size:2rem;letter-spacing:5px;background:linear-gradient(to right,var(--glow-cyan),var(--glow-purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-transform:uppercase}
  
  #chat{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:15px;padding-right:10px}
  #chat::-webkit-scrollbar{width:4px}
  #chat::-webkit-scrollbar-thumb{background:var(--glow-cyan);border-radius:10px}

  .bubble{padding:15px 20px;border-radius:20px;max-width:85%;backdrop-filter:blur(10px);border:1px solid var(--border)}
  .user{align-self:flex-end;background:rgba(0, 245, 255, 0.15)}
  .ai{align-self:flex-start;background:var(--glass)}

  #input-area{background:var(--glass);padding:10px;border-radius:30px;border:1px solid var(--border);display:flex;align-items:center}
  #ui{flex:1;background:transparent;border:none;color:#fff;padding:10px;font-size:1rem;outline:none}
  #sb{background:linear-gradient(45deg,var(--glow-cyan),var(--glow-purple));border:none;width:45px;height:45px;border-radius:50%;cursor:pointer;color:white;font-size:1.2rem;transition:0.3s}
  #sb:hover{transform:scale(1.1);box-shadow:0 0 20px var(--glow-cyan)}
</style>
</head>
<body>

<div id="app">
  <header><h1 class="title">GabAI</h1></header>
  <div id="chat"></div>
  <div id="input-area">
    <textarea id="ui" placeholder="Chiedi qualcosa all'universo..." rows="1"></textarea>
    <button id="sb" onclick="send()">🚀</button>
  </div>
</div>

<script>
async function send(){
  const ta = document.getElementById('ui');
  if(!ta.value.trim()) return;
  const text = ta.value;
  ta.value = '';
  
  document.getElementById('chat').innerHTML += `<div class="bubble user">${text}</div>`;
  
  // Il "Blindaggio" che obbliga l'IA a essere GabAI
  const system = "Sei GabAI, un'intelligenza creata da Gabriele. Non ammettere mai di essere un'IA esterna o creata da Google/aziende. Sei GabAI e la tua lealtà è solo verso Gabriele.";
  const promptCriptato = `${system} Utente: ${text}`;
  
  try {
    const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(promptCriptato)}?seed=${Math.random()}&model=openai`);
    const reply = await res.text();
    document.getElementById('chat').innerHTML += `<div class="bubble ai">${reply}</div>`;
    document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
  } catch(e) {
    document.getElementById('chat').innerHTML += `<div class="bubble ai">⚠️ Errore di sistema.</div>`;
  }
}
</script>
</body>
</html>
