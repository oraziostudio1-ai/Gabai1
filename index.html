<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GabAI — L'Intelligenza dell'Universo</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root{--void:#050510;--cyan:#00f5ff;--purple:#bf00ff;--glass:rgba(255,255,255,0.03);--border:rgba(0,245,255,0.2)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--void);color:#fff;font-family:'Rajdhani',sans-serif;height:100vh;overflow:hidden;display:flex;justify-content:center;position:relative}
  #app{width:100%;max-width:600px;display:flex;flex-direction:column;height:100%;padding:20px;gap:16px;z-index:1}
  .title{font-family:'Orbitron';text-align:center;font-size:2rem;background:linear-gradient(90deg,var(--cyan),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-transform:uppercase;margin-top:20px}
  #chat{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:10px}
  .bubble{padding:12px 16px;border-radius:15px;max-width:80%;font-size:1rem;border:1px solid var(--border);backdrop-filter:blur(5px)}
  .user{align-self:flex-end;background:rgba(0,245,255,0.1)}
  .ai{align-self:flex-start;background:rgba(255,255,255,0.05)}
  #input-area{background:var(--glass);padding:10px;border-radius:30px;border:1px solid var(--border);display:flex;gap:10px}
  #ui{flex:1;background:transparent;border:none;color:#fff;padding:8px;outline:none;font-family:inherit}
  #sb{background:var(--cyan);border:none;padding:8px 20px;border-radius:20px;cursor:pointer;font-weight:bold}
</style>
</head>
<body>

<div id="app">
  <h1 class="title">GabAI</h1>
  <div id="chat"><div class="bubble ai">Sistema pronto. Chiedi qualcosa.</div></div>
  <div id="input-area">
    <textarea id="ui" rows="1" placeholder="Scrivi a GabAI..."></textarea>
    <button id="sb" onclick="send()">INVIA</button>
  </div>
</div>

<script>
async function send() {
  const ta = document.getElementById('ui');
  const chat = document.getElementById('chat');
  const text = ta.value.trim();
  if(!text) return;

  chat.innerHTML += `<div class="bubble user">${text}</div>`;
  ta.value = '';
  
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: [{ role: 'user', content: text }] })
    });

    // Leggiamo la risposta come testo per vedere se c'è un errore HTML del server
    const rawResponse = await res.text();
    
    let data;
    try {
        data = JSON.parse(rawResponse);
    } catch (e) {
        throw new Error("Il server non ha risposto correttamente (risposta non JSON).");
    }

    if (data.content && data.content[0].text) {
        chat.innerHTML += `<div class="bubble ai">${data.content[0].text.replace(/\n/g, '<br>')}</div>`;
    } else {
        throw new Error(data.error || "Errore sconosciuto dal server.");
    }
  } catch(e) {
    chat.innerHTML += `<div class="bubble ai" style="color:#ff6b6b">Errore: ${e.message}</div>`;
  }
  chat.scrollTop = chat.scrollHeight;
}
</script>
</body>
</html>
