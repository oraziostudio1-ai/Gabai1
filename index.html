<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GabAI — L'Intelligenza dell'Universo</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --void:#00000a; --glow-cyan:#00f5ff; --glow-purple:#bf00ff;
    --glow-gold:#ffd700; --plasma:#ff6ef7; --text-main:#cce8ff; --text-dim:#6a8faa;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:var(--void);font-family:'Rajdhani',sans-serif;color:var(--text-main);overflow:hidden}
  #starfield{position:fixed;inset:0;z-index:0;pointer-events:none}
  .star{position:absolute;border-radius:50%;background:white;animation:twinkle var(--d) ease-in-out infinite alternate;opacity:var(--o)}
  @keyframes twinkle{to{opacity:.05;transform:scale(.4)}}
  .nebula{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0}
  .n1{width:500px;height:500px;top:-150px;left:-150px;background:radial-gradient(circle,rgba(0,245,255,.12),transparent 70%);animation:d1 20s ease-in-out infinite alternate}
  .n2{width:600px;height:600px;bottom:-200px;right:-200px;background:radial-gradient(circle,rgba(191,0,255,.12),transparent 70%);animation:d2 25s ease-in-out infinite alternate}
  .n3{width:400px;height:400px;top:40%;left:40%;background:radial-gradient(circle,rgba(255,110,247,.07),transparent 70%);animation:d3 18s ease-in-out infinite alternate}
  @keyframes d1{to{transform:translate(60px,80px)}}
  @keyframes d2{to{transform:translate(-60px,-80px)}}
  @keyframes d3{to{transform:translate(40px,-60px)}}
  #app{position:relative;z-index:1;display:flex;flex-direction:column;height:100vh;max-width:860px;margin:0 auto;padding:0 16px}
  header{display:flex;align-items:center;gap:16px;padding:20px 0 14px;border-bottom:1px solid rgba(0,245,255,.12);flex-shrink:0}
  .logo-orb{width:52px;height:52px;border-radius:50%;flex-shrink:0;background:conic-gradient(from 0deg,#00f5ff,#bf00ff,#ff6ef7,#ffd700,#00f5ff);animation:spin 6s linear infinite;box-shadow:0 0 28px rgba(0,245,255,.5),0 0 60px rgba(191,0,255,.3);display:flex;align-items:center;justify-content:center}
  @keyframes spin{to{transform:rotate(360deg)}}
  .logo-inner{width:38px;height:38px;border-radius:50%;background:var(--void);display:flex;align-items:center;justify-content:center;font-size:18px}
  .hd-text h1{font-family:'Orbitron',monospace;font-size:1.6rem;font-weight:900;background:linear-gradient(90deg,var(--glow-cyan),var(--plasma),var(--glow-gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:3px}
  .hd-sub{font-size:.72rem;color:var(--text-dim);letter-spacing:2px;text-transform:uppercase;margin-top:2px}
  .status{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:.7rem;color:var(--glow-cyan);letter-spacing:1px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--glow-cyan);animation:pulse 1.5s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 4px var(--glow-cyan)}50%{box-shadow:0 0 14px var(--glow-cyan),0 0 28px rgba(0,245,255,.4)}}
  #quick-qs{display:flex;gap:8px;flex-wrap:wrap;padding:12px 0 8px;flex-shrink:0}
  .qb{font-family:'Rajdhani',sans-serif;font-size:.78rem;font-weight:600;padding:6px 14px;border-radius:20px;cursor:pointer;border:1px solid rgba(0,245,255,.25);background:rgba(0,245,255,.05);color:var(--text-main);transition:all .2s;letter-spacing:.5px}
  .qb:hover{background:rgba(0,245,255,.15);border-color:var(--glow-cyan);box-shadow:0 0 12px rgba(0,245,255,.2);transform:translateY(-1px)}
  #chat{flex:1;overflow-y:auto;padding:16px 0 8px;display:flex;flex-direction:column;gap:14px;scrollbar-width:thin;scrollbar-color:rgba(0,245,255,.2) transparent}
  #chat::-webkit-scrollbar{width:4px}
  #chat::-webkit-scrollbar-thumb{background:rgba(0,245,255,.2);border-radius:4px}
  #welcome{text-align:center;padding:40px 20px;animation:up .8s ease both}
  #welcome .wt{font-family:'Orbitron',monospace;font-size:2rem;font-weight:900;background:linear-gradient(135deg,var(--glow-cyan),var(--plasma));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
  #welcome p{color:var(--text-dim);font-size:.95rem;line-height:1.6;max-width:500px;margin:0 auto}
  .badge{display:inline-block;margin-top:14px;padding:4px 16px;border-radius:20px;border:1px solid rgba(255,215,0,.3);font-size:.72rem;color:var(--glow-gold);letter-spacing:2px;text-transform:uppercase;background:rgba(255,215,0,.05)}
  .msg{display:flex;gap:10px;animation:up .35s ease both;max-width:100%}
  .msg.user{flex-direction:row-reverse}
  .av{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px;margin-top:2px}
  .av.ai-av{background:conic-gradient(from 0deg,#bf00ff,#00f5ff,#bf00ff);box-shadow:0 0 14px rgba(191,0,255,.4);animation:spin 8s linear infinite}
  .av.ai-av span{background:var(--void);width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px}
  .av.usr-av{background:linear-gradient(135deg,rgba(0,245,255,.3),rgba(0,245,255,.1));border:1px solid rgba(0,245,255,.3)}
  .bubble{max-width:calc(100% - 54px);padding:12px 16px;border-radius:16px;line-height:1.65;font-size:.92rem}
  .msg.user .bubble{background:rgba(0,245,255,.08);border:1px solid rgba(0,245,255,.3);border-top-right-radius:4px}
  .msg.ai .bubble{background:rgba(191,0,255,.07);border:1px solid rgba(191,0,255,.3);border-top-left-radius:4px}
  .mn{font-size:.68rem;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:4px;font-weight:700}
  .msg.ai .mn{color:var(--plasma)}
  .msg.user .mn{color:var(--glow-cyan);text-align:right}
  .gen-img-container { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; max-width: 100%; }
  .gen-img { width: 100%; max-width: 420px; border-radius: 12px; border: 2px solid rgba(0,245,255,.3); box-shadow: 0 0 20px rgba(0,245,255,.2); background: #000; display: block; }
  .dl-btn { align-self: flex-start; font-family: 'Orbitron', sans-serif; font-size: 0.72rem; font-weight: 700; color: var(--void); background: var(--glow-cyan); border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 6px; letter-spacing: 1px; text-transform: uppercase; transition: all 0.2s; }
  .dl-btn:hover { background: #fff; box-shadow: 0 0 12px var(--glow-cyan); transform: translateY(-1px); }
  .typing{display:flex;gap:5px;align-items:center;padding:6px 0}
  .typing span{width:7px;height:7px;border-radius:50%;background:var(--glow-purple);animation:bounce 1.1s ease-in-out infinite}
  .typing span:nth-child(2){animation-delay:.18s;background:var(--plasma)}
  .typing span:nth-child(3){animation-delay:.36s;background:var(--glow-cyan)}
  @keyframes bounce{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}
  .err-b{background:rgba(255,50,50,.08)!important;border-color:rgba(255,80,80,.3)!important;color:#ff9999}
  #input-area{flex-shrink:0;padding:12px 0 20px;border-top:1px solid rgba(0,245,255,.1)}
  #input-wrap{display:flex;gap:10px;align-items:flex-end;background:rgba(10,10,40,.7);border:1px solid rgba(0,245,255,.2);border-radius:20px;padding:10px 14px;backdrop-filter:blur(10px);transition:border-color .2s,box-shadow .2s}
  #input-wrap:focus-within{border-color:rgba(0,245,255,.5);box-shadow:0 0 20px rgba(0,245,255,.12)}
  #ui{flex:1;background:none;border:none;outline:none;color:var(--text-main);font-family:'Rajdhani',sans-serif;font-size:.95rem;resize:none;max-height:120px;min-height:24px;line-height:1.5;scrollbar-width:none}
  #ui::placeholder{color:var(--text-dim)}
  #sb{width:38px;height:38px;border-radius:50%;border:none;cursor:pointer;flex-shrink:0;background:conic-gradient(from 0deg,#00f5ff,#bf00ff,#ff6ef7,#00f5ff);display:flex;align-items:center;justify-content:center;transition:transform .2s,box-shadow .2s;animation:spin 4s linear infinite}
  #sb:hover{transform:scale(1.1);box-shadow:0 0 20px rgba(0,245,255,.5)}
  #sb:active{transform:scale(.95)}
  .si{width:28px;height:28px;border-radius:50%;background:var(--void);display:flex;align-items:center;justify-content:center;font-size:14px}
  #info{text-align:center;font-size:.65rem;color:var(--text-dim);margin-top:6px;letter-spacing:1px;padding:5px 0}
  @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div id="starfield"></div>
<div class="nebula n1"></div><div class="nebula n2"></div><div class="nebula n3"></div>

<div id="app">
  <header>
    <div class="logo-orb"><div class="logo-inner">🌌</div></div>
    <div class="hd-text"><h1>GABAI</h1><div class="hd-sub">Intelligenza Protetta</div></div>
    <div class="status"><div class="dot"></div><span>SCUDO ATTIVO</span></div>
  </header>

  <div id="chat"><div id="welcome"><div class="wt">Ciao, sono GabAI 🚀</div><p>Sistema di comunicazione protetto tramite proxy attivo.</p></div></div>

  <div id="input-area">
    <div id="input-wrap">
      <textarea id="ui" rows="1" placeholder="Scrivi..." maxlength="2000"></textarea>
      <button id="sb" onclick="send()"><div class="si">🚀</div></button>
    </div>
    <div id="info">GabAI Core · Scudo Google Apps Script</div>
  </div>
</div>

<script>
// IL TUO URL PROXY (INCOLLATO DA GOOGLE)
const SERVER_PROXY_URL = 'https://script.google.com/macros/s/AKfycbwmo1CJwVZebh_2Z5CeYICc-Fg8Y2mXwubmhd_BE4mLwnNjwfjcey2_bka3aS3kKtetq/exec';

let history = [{role:"user", parts:[{text:"Sei GabAI, creata da Gabriele."}]},{role:"model", parts:[{text:"Sono GabAI, intelligenza creata da Gabriele."}]}];
let loading = false;

function md(t){ return t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>'); }

function appendMsg(role,html){
  document.getElementById('welcome')?.remove();
  const d=document.createElement('div'); d.className=`msg ${role==='user'?'user':'ai'}`;
  d.innerHTML=`<div class="av ${role==='user'?'usr-av':'ai-av'}"><span>${role==='user'?'👤':'🌌'}</span></div>
  <div><div class="mn">${role==='user'?'Tu':'GabAI'}</div><div class="bubble">${html}</div></div>`;
  document.getElementById('chat').appendChild(d);
  document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
}

async function send(){
  const ta = document.getElementById('ui');
  if(loading || !ta.value.trim()) return;
  const text = ta.value;
  ta.value = '';
  appendMsg('user', md(text));
  loading = true;
  history.push({role:'user', parts:[{text: text}]});

  try {
    const res = await fetch(SERVER_PROXY_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contents: history }),
      redirect: 'follow'
    });
    const data = await res.json();
    const reply = data.candidates[0].content.parts[0].text;
    appendMsg('ai', md(reply));
    history.push({role:'model', parts:[{text: reply}]});
  } catch(e) {
    appendMsg('ai', '⚠️ Errore di connessione allo Scudo.');
  } finally { loading = false; }
}
</script>
</body>
</html>
