<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GabAI — L'Intelligenza dell'Universo</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  --void:#050510;
  --cyan:#00f5ff;
  --purple:#bf00ff;
  --pink:#ff0099;
  --glass:rgba(255,255,255,0.03);
  --border:rgba(0,245,255,0.2);
  --glow:0 0 20px rgba(0,245,255,0.3),0 0 60px rgba(0,245,255,0.08);
}
*{margin:0;padding:0;box-sizing:border-box}

body{
  background:var(--void);color:#e8f4ff;
  font-family:'Rajdhani',sans-serif;
  height:100vh;overflow:hidden;
  display:flex;justify-content:center;
}

/* ── CANVAS ── */
#gc{position:fixed;inset:0;z-index:0;pointer-events:none}

/* ── NEBULOSE ── */
.nb{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0;animation:nbDrift 18s ease-in-out infinite alternate}
.nb1{width:500px;height:500px;background:radial-gradient(circle,rgba(191,0,255,.12),transparent 70%);top:-120px;right:-120px}
.nb2{width:550px;height:400px;background:radial-gradient(circle,rgba(0,245,255,.08),transparent 70%);bottom:-140px;left:-140px;animation-delay:-8s}
.nb3{width:280px;height:280px;background:radial-gradient(circle,rgba(255,0,153,.06),transparent 70%);top:45%;left:8%;animation-delay:-14s}
@keyframes nbDrift{0%{transform:translate(0,0) scale(1)}100%{transform:translate(25px,18px) scale(1.08)}}

/* ── APP ── */
#app{
  width:100%;max-width:620px;
  display:flex;flex-direction:column;
  height:100%;padding:16px;gap:12px;
  z-index:10;position:relative;
}

/* ── HEADER ── */
.hdr{
  display:flex;align-items:center;justify-content:center;
  padding:14px 20px;border-radius:20px;
  border:1px solid var(--border);
  background:rgba(5,5,16,.85);
  backdrop-filter:blur(20px);
  position:relative;overflow:hidden;
}
.hdr::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(0,245,255,.05),transparent);
  animation:scan 3.5s ease-in-out infinite;
}
@keyframes scan{0%,100%{transform:translateX(-100%)}50%{transform:translateX(100%)}}

.logo{
  width:46px;height:46px;border-radius:50%;
  border:2px solid var(--cyan);
  display:flex;align-items:center;justify-content:center;
  margin-right:14px;flex-shrink:0;font-size:20px;
  box-shadow:var(--glow),inset 0 0 14px rgba(0,245,255,.1);
  position:relative;animation:logoPulse 2.5s ease-in-out infinite;
}
.logo::before{content:'';position:absolute;inset:-5px;border-radius:50%;border:1px solid rgba(191,0,255,.35);animation:spin 5s linear infinite}
.logo::after {content:'';position:absolute;inset:-10px;border-radius:50%;border:1px dashed rgba(0,245,255,.18);animation:spin 9s linear infinite reverse}
@keyframes logoPulse{0%,100%{box-shadow:var(--glow)}50%{box-shadow:0 0 35px rgba(0,245,255,.5),0 0 80px rgba(0,245,255,.15)}}
@keyframes spin{to{transform:rotate(360deg)}}

.title-wrap{display:flex;flex-direction:column}
.title{
  font-family:'Orbitron',sans-serif;font-size:1.7rem;font-weight:900;
  background:linear-gradient(90deg,var(--cyan),var(--purple),var(--cyan));
  background-size:200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  animation:gradMove 4s linear infinite;letter-spacing:3px;
}
@keyframes gradMove{0%{background-position:0%}100%{background-position:200%}}
.subtitle{font-size:.62rem;color:rgba(0,245,255,.45);letter-spacing:4px;text-transform:uppercase;font-weight:300}

.online{
  position:absolute;right:18px;top:50%;transform:translateY(-50%);
  display:flex;align-items:center;gap:6px;
  font-size:.62rem;color:rgba(0,245,255,.55);letter-spacing:2px;
}
.dot{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan);animation:blink 1.6s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

/* ── CHAT ── */
#chat{
  flex:1;overflow-y:auto;
  display:flex;flex-direction:column;gap:14px;
  padding:12px 6px;
  scrollbar-width:thin;scrollbar-color:rgba(0,245,255,.18) transparent;
}
#chat::-webkit-scrollbar{width:3px}
#chat::-webkit-scrollbar-thumb{background:rgba(0,245,255,.18);border-radius:2px}

.mwrap{display:flex;flex-direction:column;gap:3px;animation:pop .4s cubic-bezier(.34,1.56,.64,1) both}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.mwrap.user{align-items:flex-end}
.mwrap.ai  {align-items:flex-start}

.mmeta{font-size:.58rem;color:rgba(255,255,255,.28);letter-spacing:2px;padding:0 8px}

.bubble{
  padding:11px 16px;border-radius:18px;
  max-width:82%;font-size:.97rem;line-height:1.6;
  position:relative;overflow:hidden;
}
.bubble.user{
  background:linear-gradient(135deg,rgba(0,245,255,.13),rgba(191,0,255,.08));
  border:1px solid rgba(0,245,255,.28);
  border-bottom-right-radius:4px;
  box-shadow:0 3px 18px rgba(0,245,255,.08);
}
.bubble.ai{
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.09);
  border-bottom-left-radius:4px;
}
.bubble img.prev{
  max-width:180px;max-height:180px;
  border-radius:10px;display:block;
  margin-bottom:7px;
  border:1px solid rgba(0,245,255,.2);
}

/* typing dots */
.tdots{display:flex;gap:5px;padding:3px 0}
.td{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 6px var(--cyan);animation:tb 1.1s ease-in-out infinite}
.td:nth-child(2){animation-delay:.2s;background:var(--purple);box-shadow:0 0 6px var(--purple)}
.td:nth-child(3){animation-delay:.4s;background:var(--pink);box-shadow:0 0 6px var(--pink)}
@keyframes tb{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-8px)}}

/* ── IMAGE STRIP ── */
#strip{
  display:none;flex-wrap:wrap;gap:8px;
  padding:8px 12px;border-radius:14px;
  background:rgba(0,245,255,.04);
  border:1px solid rgba(0,245,255,.14);
  animation:pop .3s ease both;
}
#strip.on{display:flex}
.ithumb-wrap{position:relative}
.ithumb{width:54px;height:54px;border-radius:10px;object-fit:cover;border:1px solid rgba(0,245,255,.28);transition:transform .2s}
.ithumb:hover{transform:scale(1.06)}
.irm{
  position:absolute;top:-5px;right:-5px;
  width:17px;height:17px;border-radius:50%;
  background:rgba(255,0,80,.9);border:none;cursor:pointer;
  font-size:9px;color:#fff;display:flex;align-items:center;justify-content:center;
  transition:transform .2s;
}
.irm:hover{transform:scale(1.2)}

/* ── INPUT AREA ── */
#ia{
  background:rgba(5,5,16,.88);
  padding:10px 12px;border-radius:26px;
  border:1px solid var(--border);
  display:flex;flex-direction:column;gap:8px;
  backdrop-filter:blur(22px);
  box-shadow:var(--glow);
  transition:border-color .3s,box-shadow .3s;
  position:relative;overflow:hidden;
}
#ia::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--cyan),var(--purple),transparent);
  opacity:.35;
}
#ia:focus-within{
  border-color:rgba(0,245,255,.4);
  box-shadow:0 0 40px rgba(0,245,255,.1),0 0 80px rgba(0,245,255,.05);
}
.irow{display:flex;align-items:flex-end;gap:8px}

#ui{
  flex:1;background:transparent;border:none;color:#e8f4ff;
  padding:8px 4px;outline:none;
  font-family:'Rajdhani',sans-serif;font-size:1rem;
  resize:none;max-height:120px;line-height:1.5;scrollbar-width:none;
}
#ui::placeholder{color:rgba(0,245,255,.3)}

.tbtn{
  width:40px;height:40px;border-radius:50%;
  border:1px solid var(--border);
  background:rgba(0,245,255,.05);
  cursor:pointer;color:var(--cyan);
  display:flex;align-items:center;justify-content:center;
  font-size:17px;transition:all .25s;flex-shrink:0;
}
.tbtn:hover{background:rgba(0,245,255,.12);box-shadow:var(--glow);transform:scale(1.08)}
.tbtn.on{background:rgba(0,245,255,.18);border-color:var(--cyan);box-shadow:var(--glow)}
.tbtn.rec{background:rgba(255,0,80,.18);border-color:#ff0050;color:#ff0050;animation:recP .8s ease infinite;box-shadow:0 0 18px rgba(255,0,80,.35)}
@keyframes recP{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

#sb{
  height:40px;padding:0 22px;border-radius:20px;border:none;cursor:pointer;
  font-family:'Orbitron',sans-serif;font-size:.68rem;font-weight:700;letter-spacing:2px;
  background:linear-gradient(90deg,var(--cyan),var(--purple));
  color:var(--void);transition:all .25s;flex-shrink:0;overflow:hidden;position:relative;
}
#sb::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);transform:translateX(-100%)}
#sb:hover::before{animation:sh .55s ease}
#sb:hover{transform:scale(1.05);box-shadow:0 0 22px rgba(0,245,255,.35),0 0 50px rgba(191,0,255,.2)}
#sb:disabled{opacity:.45;cursor:not-allowed;transform:none}
@keyframes sh{to{transform:translateX(100%)}}

/* ── VOICE MODAL ── */
#vm{
  display:none;position:fixed;inset:0;z-index:100;
  background:rgba(5,5,16,.96);backdrop-filter:blur(24px);
  flex-direction:column;align-items:center;justify-content:center;gap:26px;
}
#vm.on{display:flex}

.orb-wrap{position:relative;display:flex;align-items:center;justify-content:center}
.orb{
  width:158px;height:158px;border-radius:50%;cursor:pointer;
  background:radial-gradient(circle at 35% 35%,rgba(0,245,255,.28),rgba(191,0,255,.18),rgba(5,5,16,.85));
  border:2px solid rgba(0,245,255,.4);
  display:flex;align-items:center;justify-content:center;font-size:52px;
  box-shadow:0 0 60px rgba(0,245,255,.18),inset 0 0 40px rgba(0,245,255,.05);
  transition:all .3s;position:relative;overflow:visible;
}
.orb.listen{animation:orbP 1s ease-in-out infinite;border-color:var(--cyan);box-shadow:0 0 80px rgba(0,245,255,.4),0 0 160px rgba(0,245,255,.12)}
.orb.speak {animation:orbS .5s ease-in-out infinite;border-color:var(--purple);box-shadow:0 0 80px rgba(191,0,255,.4)}
@keyframes orbP{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes orbS{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}

.or{position:absolute;border-radius:50%;border-style:solid;pointer-events:none;animation:spinR 4s linear infinite}
.or1{inset:-20px;border-width:1px;border-color:rgba(0,245,255,.2)}
.or2{inset:-40px;border-width:1px;border-color:rgba(191,0,255,.15);animation-duration:7s;animation-direction:reverse}
.or3{inset:-62px;border-width:1px;border-color:rgba(255,0,153,.1);animation-duration:11s}
@keyframes spinR{to{transform:rotate(360deg)}}

.waveform{display:flex;align-items:center;gap:4px;height:48px}
.wb{
  width:4px;border-radius:3px;min-height:6px;
  background:linear-gradient(to top,var(--cyan),var(--purple));
  box-shadow:0 0 5px var(--cyan);
  animation:wbD .6s ease-in-out infinite;
}
@keyframes wbD{0%,100%{transform:scaleY(1)}50%{transform:scaleY(2.5)}}

.vlabel{font-family:'Orbitron',sans-serif;font-size:.72rem;color:rgba(0,245,255,.65);letter-spacing:4px;text-transform:uppercase}
.vtxt{font-size:1rem;color:rgba(255,255,255,.78);text-align:center;max-width:380px;min-height:38px}

.vbtns{display:flex;gap:14px}
.vb{padding:10px 28px;border-radius:30px;border:none;cursor:pointer;font-family:'Orbitron',sans-serif;font-size:.63rem;letter-spacing:2px;font-weight:700;transition:all .25s}
.vb-ok{background:linear-gradient(90deg,var(--cyan),#00bfff);color:var(--void)}
.vb-cl{background:rgba(255,255,255,.07);color:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.1)}
.vb:hover{transform:scale(1.05);filter:brightness(1.1)}

.foot{text-align:center;font-size:.58rem;color:rgba(255,255,255,.18);letter-spacing:3px;padding-bottom:2px}
</style>
</head>
<body>

<canvas id="gc"></canvas>
<div class="nb nb1"></div>
<div class="nb nb2"></div>
<div class="nb nb3"></div>

<!-- VOICE MODAL -->
<div id="vm">
  <div class="orb-wrap">
    <div class="orb" id="orb" onclick="toggleListen()">
      <div class="or or1"></div><div class="or or2"></div><div class="or or3"></div>
      <span id="orbIcon">🎙️</span>
    </div>
  </div>
  <div class="waveform" id="wf">
    <div class="wb" style="animation-delay:0s"></div>
    <div class="wb" style="animation-delay:.1s"></div>
    <div class="wb" style="animation-delay:.2s"></div>
    <div class="wb" style="animation-delay:.3s"></div>
    <div class="wb" style="animation-delay:.2s"></div>
    <div class="wb" style="animation-delay:.1s"></div>
    <div class="wb" style="animation-delay:0s"></div>
  </div>
  <div class="vlabel" id="vlabel">PREMI PER PARLARE</div>
  <div class="vtxt"  id="vtxt">…</div>
  <div class="vbtns">
    <button class="vb vb-ok" onclick="sendVoice()">INVIA</button>
    <button class="vb vb-cl" onclick="closeVM()">CHIUDI</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="hdr">
    <div class="logo">✦</div>
    <div class="title-wrap">
      <div class="title">GabAI</div>
      <div class="subtitle">L'Intelligenza dell'Universo</div>
    </div>
    <div class="online"><div class="dot"></div>ONLINE</div>
  </div>

  <div id="chat">
    <div class="mwrap ai">
      <div class="mmeta">GABAI · SISTEMA</div>
      <div class="bubble ai">✦ Sistema attivato. Sono GabAI, la tua intelligenza cosmica. Scrivimi, inviami un'immagine o parla direttamente con me.</div>
    </div>
  </div>

  <div id="strip"></div>

  <div id="ia">
    <div class="irow">
      <button class="tbtn" onclick="document.getElementById('fi').click()" title="Carica immagine">🖼️</button>
      <input type="file" id="fi" accept="image/*" multiple style="display:none" onchange="handleImgs(this)">
      <textarea id="ui" rows="1" placeholder="Scrivi a GabAI…" oninput="resize(this)" onkeydown="onKey(event)"></textarea>
      <button class="tbtn" id="micBtn" onclick="openVM()" title="Voce">🎙️</button>
      <button class="tbtn" id="ttsBtn" onclick="toggleTTS()" title="Risposta vocale">🔊</button>
      <button id="sb" onclick="send()">INVIA</button>
    </div>
  </div>

  <div class="foot">GabAI · POWERED BY GROQ · COSMO DIGITALE</div>
</div>

<script>
/* ══ GALAXY CANVAS ══ */
const cv=document.getElementById('gc'),cx=cv.getContext('2d');
let stars=[],shoots=[];

function resizeCv(){cv.width=innerWidth;cv.height=innerHeight;initStars()}
function initStars(){
  stars=[];
  for(let i=0;i<200;i++) stars.push({
    x:Math.random()*cv.width, y:Math.random()*cv.height,
    r:Math.random()*1.7+.2, a:Math.random(),
    da:Math.random()*.007+.002,
    h:Math.random()<.15?185+Math.random()*50:215+Math.random()*30
  });
}
function spawnShoot(){
  shoots.push({x:Math.random()*cv.width*.7,y:Math.random()*cv.height*.4,
    vx:4+Math.random()*6,vy:2+Math.random()*4,len:110+Math.random()*80,a:1,
    h:Math.random()<.5?190:270});
}
function drawCv(){
  cx.clearRect(0,0,cv.width,cv.height);
  stars.forEach(s=>{
    s.a+=s.da; if(s.a>1||s.a<0) s.da*=-1;
    cx.beginPath(); cx.arc(s.x,s.y,s.r,0,Math.PI*2);
    cx.fillStyle=`hsla(${s.h},90%,90%,${s.a})`; cx.fill();
  });
  shoots.forEach((s,i)=>{
    const g=cx.createLinearGradient(s.x,s.y,s.x-s.len*.7,s.y-s.len*.35);
    g.addColorStop(0,`hsla(${s.h},100%,92%,${s.a})`);
    g.addColorStop(1,`hsla(${s.h},100%,92%,0)`);
    cx.beginPath(); cx.strokeStyle=g; cx.lineWidth=1.8;
    cx.moveTo(s.x,s.y); cx.lineTo(s.x-s.len*.7,s.y-s.len*.35); cx.stroke();
    s.x+=s.vx; s.y+=s.vy; s.a-=.013;
    if(s.a<=0) shoots.splice(i,1);
  });
  requestAnimationFrame(drawCv);
}
setInterval(spawnShoot,3000);
window.addEventListener('resize',resizeCv);
resizeCv(); drawCv();

/* ══ IMAGES ══ */
let imgs=[];

async function handleImgs(inp){
  for(const f of inp.files){
    const b64=await toB64(f);
    imgs.push({b64,mt:f.type,prev:URL.createObjectURL(f)});
  }
  inp.value=''; renderStrip();
}
function toB64(f){
  return new Promise((ok,err)=>{
    const r=new FileReader();
    r.onload=()=>ok(r.result.split(',')[1]);
    r.onerror=err; r.readAsDataURL(f);
  });
}
function renderStrip(){
  const s=document.getElementById('strip');
  s.innerHTML='';
  if(!imgs.length){s.classList.remove('on');return}
  s.classList.add('on');
  imgs.forEach((img,i)=>{
    const w=document.createElement('div'); w.className='ithumb-wrap';
    const el=document.createElement('img'); el.src=img.prev; el.className='ithumb';
    const rm=document.createElement('button'); rm.className='irm'; rm.textContent='✕';
    rm.onclick=()=>{imgs.splice(i,1);renderStrip()};
    w.append(el,rm); s.append(w);
  });
}

/* ══ CHAT ══ */
function addMsg(role,text,prevUrl=null){
  const chat=document.getElementById('chat');
  const w=document.createElement('div'); w.className=`mwrap ${role}`;
  const m=document.createElement('div'); m.className='mmeta';
  m.textContent=role==='user'?'TU · UMANO':'GABAI · AI';
  const b=document.createElement('div'); b.className=`bubble ${role}`;
  if(prevUrl){const img=document.createElement('img');img.src=prevUrl;img.className='prev';b.appendChild(img)}
  b.innerHTML+=text.replace(/\n/g,'<br>');
  w.append(m,b); chat.appendChild(w); chat.scrollTop=chat.scrollHeight;
}
function addTyping(){
  const chat=document.getElementById('chat');
  const w=document.createElement('div'); w.className='mwrap ai'; w.id='tw';
  const m=document.createElement('div'); m.className='mmeta'; m.textContent='GABAI · ELABORAZIONE';
  const b=document.createElement('div'); b.className='bubble ai';
  b.innerHTML='<div class="tdots"><div class="td"></div><div class="td"></div><div class="td"></div></div>';
  w.append(m,b); chat.appendChild(w); chat.scrollTop=chat.scrollHeight;
}
function remTyping(){document.getElementById('tw')?.remove()}

/* ══ SEND ══ */
async function send(){
  const ta=document.getElementById('ui');
  const text=ta.value.trim();
  if(!text&&!imgs.length) return;

  const btn=document.getElementById('sb'); btn.disabled=true;
  const prevUrl=imgs.length?imgs[0].prev:null;
  addMsg('user',text||'[Immagine]',prevUrl);
  ta.value=''; resize(ta);

  // Costruisco il messaggio
  let content;
  if(imgs.length){
    content=[];
    imgs.forEach(img=>content.push({type:'image',source:{type:'base64',media_type:img.mt,data:img.b64}}));
    if(text) content.push({type:'text',text});
    else content.push({type:'text',text:'Analizza questa immagine.'});
  } else {
    content=text;
  }

  imgs=[]; renderStrip();
  addTyping();

  try{
    const res=await fetch('/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({messages:[{role:'user',content}]})
    });

    const raw=await res.text();
    let data;
    try{data=JSON.parse(raw)}
    catch(e){throw new Error('Risposta non valida: '+raw.substring(0,100))}

    remTyping();
    if(data.content&&data.content[0]?.text){
      const reply=data.content[0].text;
      addMsg('ai',reply);
      if(ttsOn) speak(reply);
    } else {
      addMsg('ai','⚠️ '+(data.error||JSON.stringify(data)));
    }
  }catch(e){
    remTyping();
    addMsg('ai','⚠️ Errore: '+e.message);
  }
  btn.disabled=false;
}

function onKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}}
function resize(ta){ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,120)+'px'}

/* ══ TTS ══ */
let ttsOn=false;
function toggleTTS(){
  ttsOn=!ttsOn;
  const b=document.getElementById('ttsBtn');
  b.classList.toggle('on',ttsOn);
  b.textContent=ttsOn?'🔊':'🔇';
}
function speak(txt){
  if(!speechSynthesis) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(txt.replace(/[*_#`>]/g,'').substring(0,600));
  u.lang='it-IT'; u.rate=1.05; u.pitch=1;
  const v=speechSynthesis.getVoices().find(v=>v.lang.startsWith('it'));
  if(v) u.voice=v;
  u.onstart=()=>document.getElementById('orb')?.classList.add('speak');
  u.onend  =()=>document.getElementById('orb')?.classList.remove('speak');
  speechSynthesis.speak(u);
}

/* ══ VOICE INPUT ══ */
let rec=null,listening=false,vtranscript='';

function openVM(){
  vtranscript='';
  document.getElementById('vtxt').textContent='…';
  document.getElementById('vlabel').textContent='PREMI PER PARLARE';
  document.getElementById('vm').classList.add('on');
}
function closeVM(){stopListen();document.getElementById('vm').classList.remove('on')}

function toggleListen(){listening?stopListen():startListen()}

function startListen(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert('Browser non supporta il riconoscimento vocale');return}
  rec=new SR(); rec.lang='it-IT'; rec.interimResults=true; rec.continuous=true;
  rec.onstart=()=>{
    listening=true;
    document.getElementById('orb').classList.add('listen');
    document.getElementById('orbIcon').textContent='⏸️';
    document.getElementById('vlabel').textContent='IN ASCOLTO…';
    animWave(true);
  };
  rec.onresult=e=>{
    let fin='',int='';
    for(let i=e.resultIndex;i<e.results.length;i++)
      e.results[i].isFinal ? fin+=e.results[i][0].transcript : int+=e.results[i][0].transcript;
    if(fin) vtranscript+=fin+' ';
    document.getElementById('vtxt').textContent=(vtranscript+int)||'…';
  };
  rec.onend=()=>{if(listening) rec.start()};
  rec.onerror=()=>stopListen();
  rec.start();
}
function stopListen(){
  listening=false; rec?.stop();
  document.getElementById('orb')?.classList.remove('listen');
  document.getElementById('orbIcon').textContent='🎙️';
  document.getElementById('vlabel').textContent='PREMI PER PARLARE';
  animWave(false);
}
function animWave(on){
  document.querySelectorAll('.wb').forEach((b,i)=>{
    clearInterval(b._t);
    if(on){const f=()=>{b.style.height=(Math.random()*38+5)+'px'};b._t=setInterval(f,140+i*25);f()}
    else b.style.height='8px';
  });
}
function sendVoice(){
  const t=vtranscript.trim();
  if(!t){closeVM();return}
  document.getElementById('ui').value=t;
  resize(document.getElementById('ui'));
  closeVM(); send();
}

speechSynthesis?.addEventListener?.('voiceschanged',()=>speechSynthesis.getVoices());
</script>
